<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="184x184" href="../global-images/ai-concept.png">
<title>Vintage Car Signup</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

    :root {
  --primary: #6B1E1E;
  --secondary: #bd9d5d;
  --bg: #ffffff;
  --text: #111;
}

body.dark {
  --bg: #121212;
  --text: #f5f5f5;
--primary: #A94444;    
  --secondary: #E6C27A;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Georgia, serif;
    overflow:hidden;
    transition:0.4s;
    background:#f8f6f1;
}

.dark{
    background:#111827;
}

.brand-logo{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
}

.brand-logo img{
    width: 50px;
    height: 50px;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
}

.brand-text{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: "Playfair Display", serif;
    font-size:20px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
}

.brand-primary{
    color: var(--primary);
}

.brand-secondary{
    color: var(--secondary);
}


.bg-animation{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.bg-animation span{
    position:absolute;
    display:block;
    border-radius:50%;
    animation: float 18s linear infinite;
    opacity:0.15;
}

.bg-animation span:nth-child(1){
    width:120px;
    height:120px;
    background:#d97706;
    left:10%;
}

.bg-animation span:nth-child(2){
    width:180px;
    height:180px;
    background:#1e3a8a;
    left:70%;
}

.bg-animation span:nth-child(3){
    width:90px;
    height:90px;
    background:#991b1b;
    left:40%;
}

@keyframes float{
    0%{transform:translateY(100vh) scale(0);}
    100%{transform:translateY(-10vh) scale(1);}
}

.glass{
    backdrop-filter:blur(14px);
    background:rgba(255,255,255,0.75);
    border:1px solid rgba(255,255,255,0.3);
}

.dark .glass{
    background:rgba(17,24,39,0.8);
    color:white;
}

.dark input{
    background:rgba(255,255,255,0.08);
    color:white;
}

.dark input::placeholder{
    color:#ccc;
}

.dark .social-light{
    background:#1f2937;
    color:white;
}

.social-btn{
  width: 100%;
  padding: 13px;

  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);

  background: transparent; /* removed background */
  color: var(--text);

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  font-size: 15px;
  font-weight: 500;

  cursor: pointer;
  transition: 0.3s ease;
}

/* Hover */
.social-btn:hover{
  background: var(--primary);
  color: #fff;

  transform: translateY(-3px);
}

/* Dark mode border */
body.dark .social-btn{
  border: 1px solid rgba(255,255,255,0.08);
}

.signup-btn{
  width: 100%;
  padding: 12px;

  border: none;
  border-radius: 12px;

  background: var(--primary);
  color: #fff;

  font-size: 16px;
  font-weight: 600;

  cursor: pointer;
  transition: all 0.3s ease;
}

.signup-btn:hover{
  background: var(--secondary);
  color: #000;

  transform: translateY(-3px);
}


@media(max-width:768px){
    .grid-name{
        grid-template-columns:1fr !important;
    }

    .social-grid{
        grid-template-columns:1fr !important;
    }

    .signup-card{
        width:90%;
        padding:20px;
    }
}

@media(max-width:300px){
    .signup-card{
        width:96%;
        padding:14px;
    }

    .social-btn{
        font-size:12px;
    }
}
@media(max-width:360px){

    body{
        padding:12px;
        overflow:auto;
        align-items:flex-start;
    }

    .signup-card{
        margin-top: 50px;
        width:100%;
        height:90%;
        padding:10px 16px;
        border-radius:20px;
    }

    .signup-card a{
        font-size:20px;
    }

    .signup-card p{
        font-size:10px;
    }

    input{
        padding:5px !important;
        font-size:12px;
    }

    button{
        font-size:15px;

    }

    .social-btn{
        width:100%;
    }
}
</style>
</head>

<body class="h-screen flex items-center justify-center px-4">


<div class="bg-animation">
    <span></span>
    <span></span>
    <span></span>
</div>


<div class="absolute top-4 right-4 flex gap-2">

    <button id="rtlToggle"
        class="px-3 py-2 rounded-full bg-amber-500 text-black text-sm">
        RTL
    </button>

    <button id="themeToggle"
  class="p-3 rounded-full bg-black text-white">
  <i class="fas fa-moon"></i>
</button>

</div>


<div class="glass signup-card w-full max-w-md rounded-2xl shadow-2xl p-6 transition-all">

    
    <div class="text-center mb-4">
        <a href="../index.html" class="brand-logo">
    <img src="../global-images/ai-concept.png" alt="Logo">

    <span class="brand-text">
        <span class="brand-primary">Vintage</span><span class="brand-secondary">Restore</span>
    </span>
</a>
        <p class="text-sm text-gray-500 mt-1">Create your restoration account</p>
    </div>

    
    <form class="space-y-3">

        
        <div class="grid grid-cols-2 gap-3 grid-name">
            <input type="text"
                placeholder="Full Name"
                class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 outline-none">

            <input type="text"
                placeholder="Last Name"
                class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        
        <input type="email"
            placeholder="Email Address"
            class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 outline-none">

        <input type="tel"
            placeholder="Phone Number"
            class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 outline-none">

        <div class="relative">
            <input id="password"
                type="password"
                placeholder="Password"
                class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 outline-none">

            <i id="togglePassword"
                class="fas fa-eye absolute right-4 top-3 cursor-pointer text-gray-500"></i>
        </div>

        <div class="relative">
            <input id="confirmPassword"
                type="password"
                placeholder="Confirm Password"
                class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-amber-500 outline-none">

            <i id="toggleConfirmPassword"
                class="fas fa-eye absolute right-4 top-3 cursor-pointer text-gray-500"></i>
        </div>

        
        <button class="signup-btn">
  Sign Up
</button>

    </form>

    
    <div class="flex items-center my-3">
        <div class="flex-1 border-t"></div>
        <span class="px-3 text-sm text-gray-500">or</span>
        <div class="flex-1 border-t"></div>
    </div>

    
    <div class="grid grid-cols-3 gap-2 social-grid">

        <button class="social-btn social-light py-2 rounded-lg border flex justify-center items-center gap-2">
            <i class="fab fa-google text-red-500"></i>Google
        </button>

        <button class="social-btn py-2 rounded-lg  flex justify-center items-center gap-2">
            <i class="fab fa-apple"></i>Apple
        </button>

        <button class="social-btn py-2 rounded-lg flex justify-center items-center gap-2">
            <i class="fab fa-facebook-f"></i>Facebook
        </button>

    </div>

    
    <p class="text-center text-sm mt-3">
        Already have an account?
        <a href="../login.html" class="text-amber-600">Login</a>
    </p>

</div>

<script>


document.getElementById('togglePassword').onclick = function(){
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
};

document.getElementById('toggleConfirmPassword').onclick = function(){
    const input = document.getElementById('confirmPassword');
    input.type = input.type === 'password' ? 'text' : 'password';
};


const themeToggle = document.getElementById('themeToggle');
const icon = themeToggle.querySelector('i');

themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');

  if (document.body.classList.contains('dark')) {
    icon.classList.remove('fa-moon');
    icon.classList.add('fa-sun');
  } else {
    icon.classList.remove('fa-sun');
    icon.classList.add('fa-moon');
  }
});


document.getElementById('rtlToggle').onclick = function(){
    document.documentElement.dir =
    document.documentElement.dir === 'ltr' ? 'rtl' : 'ltr';
};

</script>

</body>
</html>
