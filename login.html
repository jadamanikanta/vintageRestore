<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="184x184" href="../global-images/logo-1.png">
<title>Vintage Car Login</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Georgia, serif;
    overflow:hidden;
    transition:0.4s;
    background:#f8f6f1;
}

.dark{
    background:#111827;
}


.bg-animation{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.bg-animation span{
    position:absolute;
    display:block;
    border-radius:50%;
    animation: float 18s linear infinite;
    opacity:0.15;
}

.bg-animation span:nth-child(1){
    width:120px;
    height:120px;
    background:#d97706;
    left:10%;
    animation-duration:15s;
}

.bg-animation span:nth-child(2){
    width:180px;
    height:180px;
    background:#1e3a8a;
    left:70%;
    animation-duration:20s;
}

.bg-animation span:nth-child(3){
    width:90px;
    height:90px;
    background:#991b1b;
    left:40%;
    animation-duration:12s;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(0);
    }
    100%{
        transform:translateY(-10vh) scale(1);
    }
}

.glass{
    backdrop-filter:blur(14px);
    background:rgba(255,255,255,0.75);
    border:1px solid rgba(255,255,255,0.3);
}

.dark .glass{
    background:rgba(17,24,39,0.8);
    color:white;
}

.dark input{
    background:rgba(255,255,255,0.08);
    color:white;
}

.dark input::placeholder{
    color:#ccc;
}

.dark .social-light{
    background:#1f2937;
    color:white;
}

.dark .social-dark{
    background:black;
}

@media(max-width:768px){
    .login-card{
        width:90%;
        padding:22px;
    }
}

@media(max-width:300px){
    .login-card{
        width:95%;
        padding:16px;
    }

    .social-btn{
        font-size:12px;
        padding:10px;
    }
}
</style>
</head>
<body class="h-screen flex items-center justify-center px-4">


<div class="bg-animation">
    <span></span>
    <span></span>
    <span></span>
</div>


<div class="absolute top-4 right-4 flex gap-2">

    <button id="rtlToggle"
        class="px-3 py-2 rounded-full bg-amber-500 text-black text-sm">
        RTL
    </button>

    <button id="themeToggle"
        class="p-3 rounded-full bg-black text-white">
        <i class="fas fa-moon"></i>
    </button>

</div>


<div class="glass login-card w-full max-w-md rounded-2xl shadow-2xl p-8 transition-all">

    
    <div class="text-center mb-5">
        <a href="../index.html"
            class="text-2xl font-bold text-amber-600 hover:text-amber-500">
            VintageRestore
        </a>
        <p class="text-sm text-gray-500 mt-1">Classic Restoration Experts</p>
    </div>

    
    <form class="space-y-4">

        <input type="email"
            placeholder="Email Address"
            class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-amber-500 outline-none">

        <div class="relative">
            <input id="password"
                type="password"
                placeholder="Password"
                class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-amber-500 outline-none">

            <i id="togglePassword"
                class="fas fa-eye absolute right-4 top-4 cursor-pointer text-gray-500"></i>
        </div>

        
        <div class="flex justify-between text-sm">
            <label class="flex items-center gap-2">
                <input type="checkbox">
                Remember Me
            </label>

            <a href="#" class="text-amber-600">Forgot Password?</a>
        </div>

        
        <button
            class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-lg font-semibold">
            Login
        </button>

    </form>

    
    <div class="flex items-center my-4">
        <div class="flex-1 border-t"></div>
        <span class="px-3 text-sm text-gray-500">or</span>
        <div class="flex-1 border-t"></div>
    </div>

    
    <div class="space-y-2">

        <button class="social-btn social-light w-full py-3 rounded-lg border flex justify-center items-center gap-2">
            <i class="fab fa-google text-red-500"></i> Google
        </button>

        <button class="social-btn social-dark w-full py-3 rounded-lg bg-black text-white flex justify-center items-center gap-2">
            <i class="fab fa-apple"></i> Apple
        </button>

        <button class="social-btn w-full py-3 rounded-lg bg-blue-600 text-white flex justify-center items-center gap-2">
            <i class="fab fa-facebook-f"></i> Facebook
        </button>

    </div>

    
    <p class="text-center text-sm mt-4">
        Don't have an account?
        <a href="../signup.html" class="text-amber-600">Sign Up</a>
    </p>

</div>

<script>


const password = document.getElementById('password');
const togglePassword = document.getElementById('togglePassword');

togglePassword.addEventListener('click', () => {
    password.type = password.type === 'password' ? 'text' : 'password';
    togglePassword.classList.toggle('fa-eye');
    togglePassword.classList.toggle('fa-eye-slash');
});


document.getElementById('themeToggle').addEventListener('click', () => {
    document.body.classList.toggle('dark');
});


document.getElementById('rtlToggle').addEventListener('click', () => {
    document.documentElement.dir =
        document.documentElement.dir === 'ltr' ? 'rtl' : 'ltr';
});

</script>

</body>
</html>
