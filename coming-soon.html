<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="184x184" href="../global-images/logo-1.png">
  <title>Coming Soon - VintageRestore</title>

  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <style>
    
    @keyframes smoke {
      0% { transform: translateY(0) scale(1); opacity: 0.2; }
      50% { transform: translateY(-60px) scale(1.2); opacity: 0.4; }
      100% { transform: translateY(-120px) scale(1); opacity: 0; }
    }

    .smoke {
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(255,255,255,0.15), transparent);
      border-radius: 50%;
      animation: smoke 7s infinite;
    }
  </style>
</head>

<body class="bg-white dark:bg-black text-black dark:text-white transition duration-300 overflow-hidden">

  
  <header class="flex justify-between items-center px-6 py-4">
    
    
    <a href="../index.html" class="text-xl font-semibold text-[#6B1E1E] dark:text-[#C8A96A]">
      Vintage<span class="text-[#C8A96A] dark:text-[#6B1E1E]">Restore</span>
    </a>

    
    <div class="flex items-center gap-4">
      <button onclick="toggleRTL()" class="px-3 py-1 border rounded text-sm">RTL</button>
      <button onclick="toggleDark()" class="px-3 py-1 border rounded text-sm">🌙</button>
    </div>

  </header>

  
  <div class="absolute inset-0 -z-10 overflow-hidden">
    <div class="smoke top-20 left-10"></div>
    <div class="smoke top-40 right-20" style="animation-delay:2s;"></div>
    <div class="smoke bottom-10 left-1/3" style="animation-delay:4s;"></div>
  </div>

  
  <main class="flex flex-col justify-center items-center text-center h-[80vh] px-4">

    
    <h1 class="text-4xl md:text-6xl font-bold text-[#6B1E1E] dark:text-[#C8A96A]">
      Coming Soon
    </h1>

    
    <p class="mt-4 max-w-xl opacity-80">
      Our vintage masterpieces are being carefully restored. Stay tuned for something timeless.
    </p>

    
    <div class="flex gap-4 mt-8 text-center">
      <div>
        <p id="days" class="text-3xl font-bold">00</p>
        <span class="text-sm opacity-70">Days</span>
      </div>
      <div>
        <p id="hours" class="text-3xl font-bold">00</p>
        <span class="text-sm opacity-70">Hours</span>
      </div>
      <div>
        <p id="minutes" class="text-3xl font-bold">00</p>
        <span class="text-sm opacity-70">Minutes</span>
      </div>
      <div>
        <p id="seconds" class="text-3xl font-bold">00</p>
        <span class="text-sm opacity-70">Seconds</span>
      </div>
    </div>

    
    <a href="../index.html"
       class="mt-8 px-6 py-3 bg-[#6B1E1E] text-white rounded-full hover:scale-105 transition">
       Back to Garage
    </a>

  </main>

  
  <script>
    // DARK MODE
    function toggleDark() {
      document.documentElement.classList.toggle('dark');
    }

    // RTL
    function toggleRTL() {
      const html = document.documentElement;
      html.dir = html.dir === "rtl" ? "ltr" : "rtl";
    }

    // COUNTDOWN
    const targetDate = new Date("2026-12-31 00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const gap = targetDate - now;

      const d = Math.floor(gap / (1000 * 60 * 60 * 24));
      const h = Math.floor((gap / (1000 * 60 * 60)) % 24);
      const m = Math.floor((gap / (1000 * 60)) % 60);
      const s = Math.floor((gap / 1000) % 60);

      document.getElementById("days").innerText = d;
      document.getElementById("hours").innerText = h;
      document.getElementById("minutes").innerText = m;
      document.getElementById("seconds").innerText = s;
    }

    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
